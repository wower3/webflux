# Chat Chart API 配置文件
server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: chat-chart-api
  codec:
    max-in-memory-size: 10MB

# 日志配置
logging:
  level:
    root: INFO
    com.chat.chart: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# AI 服务配置
ai-service:
  url: http://aiml-pub.aisp.test.abc/agent-api/workflow-agent-1-a852be77
  health-check-api: /chatabc/health_check
  init-session-api: /chatabc/init_session
  upload-file-api: /chatabc/upload_file
  chat-api: /chatabc/chat
  download-api: /chatabc/download_file
  timeout: 90000
